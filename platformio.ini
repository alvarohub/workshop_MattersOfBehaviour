; Multi-project workspace: pick the firmware via the PlatformIO env selector.
[platformio]
default_envs = shymic

[env]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Dstamps3A
    -DCORE_DEBUG_LEVEL=3
    -I include
lib_deps =
    m5stack/M5Unified
    robotis-git/Dynamixel2Arduino

[env:shymic]
build_src_filter = +<shymic/>
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
    https://github.com/pololu/vl53l1x-arduino/#1.3.1

[env:accelbot]
build_src_filter = +<accelbot/>
build_flags =
    ${env.build_flags}
lib_deps =
    ${env.lib_deps}
